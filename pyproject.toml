[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "doc-faq-generator"
version = "0.1.0"
description = "CLI tool that generates a FAQ from a folder of documents using the Anthropic Claude API"
requires-python = ">=3.11"
dependencies = [
    "anthropic==0.30.0",
    "python-dotenv==1.0.1",
    "pdfplumber==0.11.0",
    "python-docx==1.1.2",
    "scikit-learn==1.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
    "hypothesis==6.103.4",
    "pytest-cov==5.0.0",
]

[project.scripts]
faq-generator = "main:main"
faq-chatbot = "faq_chatbot:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["faq_generator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"
